<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Burger Boss in 3D</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root { --bg: #0d0d0d; --fg: #ffffff; --muted: #b9b4bb; --accent: #ff1493; --surface: #1a1418; --line: #2e2530; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Montserrat, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { padding-inline: 16px; padding-block: 20px 32px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.back { color: var(--muted); font-size: 14px; text-decoration: none; }
.back:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--accent); }
p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
model-viewer { width: 100%; height: 55vh; min-height: 300px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); --poster-color: transparent; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 700 17px Montserrat, Inter, system-ui, sans-serif; cursor: pointer; padding-inline: 20px; }
#note { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">&larr; Zurück zur Startseite</a>
  <h1>Dein Burger <span>in 3D</span></h1>
  <model-viewer id="mv" src="food2.glb" alt="3D-Modell des Gerichts"
    camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" exposure="1.1"
    ar ar-modes="scene-viewer webxr quick-look" ar-placement="floor" ar-scale="auto">
    <button slot="ar-button" class="btn" type="button">Auf deinem Tisch ansehen (AR)</button>
  </model-viewer>
  <p>Mit einem Finger drehen, mit zwei Fingern zoomen. Tippe auf den Button, richte die Kamera auf deinen Tisch und platziere das Gericht.</p>
  <p id="note" hidden>AR wird auf diesem Gerät nicht unterstützt. Öffne diese Seite auf deinem Smartphone.</p>
</div>
<script>
(function () {
  var mv = document.getElementById('mv');
  var note = document.getElementById('note');
  mv.addEventListener('load', function () {
    setTimeout(function () { if (!mv.canActivateAR) note.hidden = false; }, 600);
  });
})();
</script>
</body>
</html>
